[project]
name = "desktop-mcp"
version = "0.1.0"
description = "Server MCP con FastMCP per la gestione dei file sul Desktop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.2",
    "uvicorn>=0.44.0",
]

[project.scripts]
desktop-mcp = "desktop_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pylint>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_mcp"]

[tool.uv]
native-tls = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
